# Bounded execution check for the non-graph dynamic MAPPO baseline.
seed: 20260720
num_envs: 1
num_uavs: 3
rollout_length: 4
total_steps: 12
learning_rate: 0.0003
gamma: 0.99
gae_lambda: 0.95
clip_ratio: 0.2
entropy_coef: 0.01
value_coef: 0.5
max_grad_norm: 0.5
batch_size: 4
ppo_epochs: 1
hidden_dims: [64, 64]
evaluation_interval: 12
checkpoint_interval: 12
normalize_rewards: false
obstacle: false
communication_enabled: true
communication_delay_steps: 1
communication_drop_probability: 0.1
communication_max_staleness_steps: 3
communication_uncertainty_growth_per_step: 1.0
dynamic_obstacle_enabled: true
dynamic_obstacle_velocity_scale: 1.0
cbf_enabled: true
cbf_slack_penalty: 100.0
cbf_max_iterations: 20000
cbf_communication_uncertainty_margin_gain: 0.5
cbf_max_communication_uncertainty_margin: 5.0
