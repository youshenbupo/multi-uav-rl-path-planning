# Frozen 8-UAV independent ablation: prediction remains, uncertainty is not used
# in graph risk/topology or the execution-side CBF margin. Do not reuse full-arm weights.
seed: 20260719
num_envs: 2
num_uavs: 8
rollout_length: 24
total_steps: 100000
learning_rate: 0.0003
gamma: 0.99
gae_lambda: 0.95
clip_ratio: 0.2
entropy_coef: 0.01
value_coef: 0.5
max_grad_norm: 0.5
batch_size: 64
ppo_epochs: 2
embedding_dim: 64
graph_heads: 4
graph_layers: 2
evaluation_interval: 3072
checkpoint_interval: 3072
graph_mode: predictive_graph
communication_radius: 45.0
risk_distance: 12.0
prediction_horizon: 5.0
top_k_neighbors: 2
auxiliary_horizon: 3
aux_conflict_coef: 0.1
aux_distance_coef: 0.05
obstacle: false
communication_enabled: true
communication_delay_steps: 1
communication_drop_probability: 0.1
communication_max_staleness_steps: 3
communication_uncertainty_growth_per_step: 1.0
dynamic_obstacle_enabled: true
dynamic_obstacle_velocity_scale: 1.0
graph_uncertainty_scale: 10.0
graph_uncertainty_risk_gain: 0.0
cbf_enabled: true
cbf_slack_penalty: 100.0
cbf_max_iterations: 20000
cbf_communication_uncertainty_margin_gain: 0.0
cbf_max_communication_uncertainty_margin: 0.0
